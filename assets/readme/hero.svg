<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">Heavenly Keys</title>
  <desc id="desc">Portable Windows IT diagnostic and repair toolkit for USB restrictions and system health.</desc>

  <defs>
    <clipPath id="hero-clip">
      <rect width="1200" height="380" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#hero-clip)">
    <!-- Background -->
    <rect width="1200" height="380" fill="#0D1117"/>

    <!-- Right side: Console output -->
    <g transform="translate(720 30)">
      <rect width="430" height="300" rx="8" fill="#000000" stroke="#30363D" stroke-width="1"/>
      <!-- Title bar -->
      <rect width="430" height="28" rx="8" fill="#161B22"/>
      <rect y="12" width="430" height="16" fill="#161B22"/>
      <circle cx="16" cy="14" r="5" fill="#FF5F57"/>
      <circle cx="32" cy="14" r="5" fill="#FEBC2E"/>
      <circle cx="48" cy="14" r="5" fill="#28C840"/>
      <text x="215" y="18" text-anchor="middle" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#8B949E">USBUnlocker.exe</text>

      <!-- Console content -->
      <g transform="translate(16 40)" font-family="'SF Mono', Menlo, monospace" font-size="12">
        <text fill="#7EE787">C:\&gt; USBUnlocker.exe /scan</text>
        <text y="20" fill="#8B949E">Scanning USB restrictions...</text>
        <text y="38" fill="#F0883E">⚠ USBSTOR service: DISABLED</text>
        <text y="56" fill="#F0883E">⚠ Write protection: ENABLED</text>
        <text y="74" fill="#8B949E">  Device install: OK</text>
        <text y="92" fill="#8B949E">  Drive visibility: OK</text>
        <text y="116" fill="#7EE787">C:\&gt; USBUnlocker.exe /scanrepair</text>
        <text y="136" fill="#8B949E">Backing up current settings...</text>
        <text y="154" fill="#58A6FF">✓ USBSTOR service: ENABLED</text>
        <text y="172" fill="#58A6FF">✓ Write protection: DISABLED</text>
        <text y="192" fill="#7EE787">Repair complete. 2 issues fixed.</text>
        <text y="216" fill="#8B949E">C:\&gt; _</text>
        <!-- Blinking cursor -->
        <rect x="56" y="204" width="7" height="14" fill="#7EE787" opacity="0.8">
          <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- Left content area -->
    <g transform="translate(56 52)">
      <!-- Category -->
      <text font-family="'SF Mono', Menlo, monospace" font-size="13" fill="#58A6FF" letter-spacing="3">
        WINDOWS · USB DIAGNOSTIC &amp; REPAIR
      </text>

      <!-- Title -->
      <text y="52" font-family="Georgia, 'Songti SC', serif" font-size="48" font-weight="700" fill="#E6EDF3">
        Heavenly Keys
      </text>

      <!-- Subtitle -->
      <text y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#8B949E">
        Also known as USBUnlocker
      </text>

      <!-- Description -->
      <text y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#E6EDF3" opacity="0.7">
        Portable IT diagnostic and repair toolkit — scan, diagnose,
      </text>
      <text y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#E6EDF3" opacity="0.7">
        and repair USB restrictions caused by Group Policy, registry
      </text>
      <text y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#E6EDF3" opacity="0.7">
        settings, or domain policies.
      </text>

      <!-- Feature pills -->
      <g transform="translate(0 194)">
        <rect width="100" height="30" rx="4" fill="#58A6FF" opacity="0.1"/>
        <text x="14" y="20" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#58A6FF">SCAN</text>

        <g transform="translate(112 0)">
          <rect width="120" height="30" rx="4" fill="#F0883E" opacity="0.1"/>
          <text x="14" y="20" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#F0883E">REPAIR</text>
        </g>

        <g transform="translate(244 0)">
          <rect width="140" height="30" rx="4" fill="#7EE787" opacity="0.1"/>
          <text x="14" y="20" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#7EE787">ROLLBACK</text>
        </g>
      </g>

      <!-- Tech stack -->
      <g transform="translate(0 246)">
        <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#E6EDF3" opacity="0.4">
          .NET 6.0+ · C# · Windows 7–11 · No install required
        </text>
      </g>
    </g>

    <!-- Subtle border glow -->
    <rect width="1200" height="380" fill="none" stroke="#58A6FF" stroke-width="1" rx="20" opacity="0.08"/>
  </g>
</svg>
